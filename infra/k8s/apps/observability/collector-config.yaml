receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

extensions:
  # Kubernetes has no other way to tell a working collector from one that
  # started, failed to build a pipeline, and is quietly doing nothing.
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  # ARQ polls Redis roughly twice a second forever, and the Redis
  # instrumentation turns every poll into a span: 168 spans/minute measured at
  # idle, ~7.2M/month with zero users. That does not breach the 50GB trace
  # allowance, but it buries real traces under poll noise, which defeats the
  # point of having traces at all.
  #
  # Matched on IsRootSpan() rather than on command names. Redis work that
  # belongs to real activity always has a parent -- an HTTP request or a job --
  # so a *root* Redis span is by construction the idle poll loop. Matching
  # command names instead would silently start dropping real spans the day ARQ
  # changes which commands it polls with.
  #
  # This drops at the collector, so the worker still pays to create them. The
  # cheaper fix is suppressing instrumentation inside ARQ's poll loop, which
  # means patching library internals; that trade is deliberate and revisitable.
  filter/poll_noise:
    error_mode: ignore
    traces:
      span:
        - 'IsRootSpan() and attributes["db.system"] == "redis"'

  # First in the pipeline on purpose: under memory pressure the collector
  # must shed load rather than be OOM-killed, because a killed collector
  # loses everything already buffered.
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 40

  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

  # Identifies which cluster sent this, which matters the moment there is
  # more than one environment.
  resource:
    attributes:
      - key: deployment.environment
        value: prod
        action: upsert
      - key: k8s.cluster.name
        value: cmc-k3s
        action: upsert

exporters:
  otlphttp/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      authorization: ${env:GRAFANA_OTLP_AUTHORIZATION}
    # Retry and queue on disk-less memory: a brief Grafana outage should not
    # discard telemetry, but the queue is bounded so it cannot become the
    # memory problem it is meant to survive.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 1000

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      # Bound to 0.0.0.0, not the default localhost. These counters --
      # otelcol_exporter_sent_spans against otelcol_exporter_send_failed_spans
      # -- are the only direct evidence that telemetry is reaching Grafana. A
      # collector that has silently stopped exporting looks exactly like a
      # system with no traffic, so leaving them unreachable makes that failure
      # invisible.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/poll_noise, resource, batch]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/grafana]
