# Node-level telemetry: what the applications cannot say about themselves.
# Forwards OTLP to the gateway collector, which stays the only component that
# knows a vendor exists (ADR-0004, ADR-0013).

receivers:
  # Container and pod CPU/memory, straight from the kubelet.
  kubeletstats:
    collection_interval: 30s
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_NAME}:10250
    insecure_skip_verify: true
    metric_groups: [container, pod, node]
    # The *.cpu.utilization metrics are deprecated and slated for removal. An
    # allowlist naming them would silently keep nothing once they go, blanking
    # every dashboard built on them with no error anywhere. Opt into the
    # replacements now, while the old ones still exist to compare against.
    metrics:
      k8s.pod.cpu.usage:
        enabled: true
      k8s.node.cpu.usage:
        enabled: true
      container.cpu.usage:
        enabled: true
      # Off by default, and the only metrics that answer "is this container
      # near the limit that will get it throttled or OOM-killed". Raw usage
      # cannot answer that without knowing the limit.
      k8s.container.cpu_limit_utilization:
        enabled: true
      k8s.container.memory_limit_utilization:
        enabled: true
      # Off explicitly. Enabling the replacements does not disable these, so
      # leaving them on means the agent keeps building metrics the allowlist
      # then throws away -- and keeps logging deprecation warnings that would
      # train us to ignore its warnings.
      k8s.pod.cpu.utilization:
        enabled: false
      k8s.node.cpu.utilization:
        enabled: false
      container.cpu.utilization:
        enabled: false

  # Pod phase and restart counts. This is the part that would otherwise
  # require kube-state-metrics as a third component (ADR-0013).
  k8s_cluster:
    collection_interval: 30s
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]
    allocatable_types_to_report: [cpu, memory]

  # CloudNativePG's exporter. 107 metric families are available; ten are
  # scraped. Wholesale ingestion of a Postgres exporter is one of the standard
  # ways to blow through a 10,000-series cap, and 97 of these answer questions
  # we are not asking.
  prometheus:
    config:
      scrape_configs:
        # cert-manager. Since the zone moved to Full (strict), an expired
        # origin certificate takes the entire site down with no degraded mode
        # in between -- Cloudflare returns 526 and stops proxying. Renewal is
        # automatic at 30 days remaining, so the risk is not expiry itself but
        # renewal failing silently for a month.
        - job_name: cert-manager
          scrape_interval: 60s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [cert-manager]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              regex: '9402'
              action: keep
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'certmanager_certificate_(expiration_timestamp_seconds|ready_status|renewal_timestamp_seconds)'
              action: keep

        - job_name: cnpg
          # The database changes slowly. 60s is four times cheaper than the
          # 15s default and still gives five points inside a five-minute alert
          # window.
          scrape_interval: 60s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [cmc]
          relabel_configs:
            # Only pods on this node. Harmless on one node, but every agent in
            # a multi-node cluster would otherwise scrape every database pod
            # and report the same series several times.
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
              regex: cmc-db
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              regex: '9187'
              action: keep
          metric_relabel_configs:
            # An allowlist, for the same reason as the metrics filter below:
            # a drop-list silently admits whatever the next CNPG version adds.
            - source_labels: [__name__]
              regex: 'cnpg_(collector_up|collector_last_available_backup_timestamp|collector_last_failed_backup_timestamp|collector_first_recoverability_point|backends_total|backends_waiting_total|backends_max_tx_duration_seconds|pg_database_size_bytes|pg_replication_lag|pg_stat_archiver_failed_count)'
              action: keep

  filelog:
    include: [/var/log/pods/*/*/*.log]
    # Our own logs would describe our own log collection, forever.
    exclude: [/var/log/pods/cmc_otel-agent-*/*/*.log]
    include_file_path: true
    start_at: end
    operators:
      - type: container
        id: container-parser
      # The application logs structured JSON (app/logging.py). Parsing it here
      # means trace_id arrives as a real attribute rather than as text inside
      # the message, which is what makes log->trace navigation work at all.
      - type: json_parser
        if: 'body matches "^\\{"'
        parse_from: body
        parse_to: attributes
        on_error: send

extensions:
  # Surfaces collector health to Kubernetes, so a receiver that cannot start is
  # a failing probe rather than a silent restart loop.
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  # First in the pipeline: shed load rather than be OOM-killed. A killed
  # collector loses everything it has buffered.
  memory_limiter:
    check_interval: 1s
    limit_mib: 120
    spike_limit_mib: 30

  # Attaches pod/namespace/deployment identity, so a log line or a memory
  # sample can be traced back to a workload rather than a container id.
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.ip
      - sources:
          - from: connection

  # An allowlist, not a drop-list (plan §6.2). A drop-list silently admits
  # every metric a future receiver version invents; the free tier is 10,000
  # active series and a default kube scrape exceeds that on its own. Anything
  # not named here does not leave the node.
  filter/allowlist:
    error_mode: ignore
    metrics:
      metric:
        - 'not (name == "k8s.pod.cpu.usage"
          or name == "k8s.pod.memory.working_set"
          or name == "k8s.container.cpu_limit_utilization"
          or name == "k8s.container.memory_limit_utilization"
          or name == "k8s.container.restarts"
          or name == "k8s.pod.phase"
          or name == "k8s.node.cpu.usage"
          or name == "k8s.node.memory.working_set"
          or name == "k8s.node.condition_ready"
          or name == "k8s.deployment.available"
          or name == "k8s.deployment.desired")'

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  otlp/gateway:
    endpoint: otel-collector.cmc.svc.cluster.local:4317
    tls:
      insecure: true # in-cluster hop; TLS terminates at the gateway's egress
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 500

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [kubeletstats, k8s_cluster]
      processors: [memory_limiter, k8sattributes, filter/allowlist, batch]
      exporters: [otlp/gateway]
    # A separate pipeline on purpose. filter/allowlist names OTel metrics and
    # would drop every cnpg_ series; the Prometheus scrape does its own
    # allowlisting in metric_relabel_configs, at the source, before the series
    # is ever built.
    metrics/database:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [otlp/gateway]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [otlp/gateway]
