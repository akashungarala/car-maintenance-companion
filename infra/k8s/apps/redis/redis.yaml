# Redis: queue broker now, cache and rate limiter later — three concrete uses
# (see the plan's component table), not one component looking for a job.
#
# No persistence. Everything in it is either a queued job or a cache entry:
# jobs are re-enqueued by the schedule, cache entries are recomputed, and the
# dead-letter list is diagnostic rather than a system of record. Persistence
# would cost disk and fsync latency on a 2-CPU node to protect data that does
# not need protecting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Redis pods behind one Service would
    # split the queue in half, and consumers would silently miss jobs.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --save
            - ''
            - --appendonly
            - 'no'
            # Bounded so Redis cannot consume the node. allkeys-lru would evict
            # queued jobs; noeviction makes writes fail loudly instead, which
            # is the correct failure for a queue.
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
