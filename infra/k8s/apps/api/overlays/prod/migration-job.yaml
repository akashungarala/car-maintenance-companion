# Runs `alembic upgrade head` before the Deployment is touched.
#
# A PreSync hook rather than a sync wave: waves order resources within one sync,
# but a PreSync hook must *complete successfully* before the rest of the sync
# begins. That is the guarantee wanted — a failed migration should stop the
# deployment, not race a new image that expects a schema which is not there.
#
# The image is the same one being deployed, so the migrations that run are
# exactly the ones that shipped with the code. Kustomize rewrites this tag along
# with the Deployment's.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Keep the last failure around to read. Deleting on success keeps the
    # namespace clean; deleting on failure would delete the evidence.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # Do not retry indefinitely: a migration that fails twice is broken, and
  # retrying it just delays the alert.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/akashungarala/car-maintenance-companion/api:latest
          # alembic resolves script_location relative to the working directory, not
          # to the ini file's location, so this must be the directory holding
          # migrations/ — otherwise it reports the folder simply does not exist.
          workingDir: /app
          command: ['alembic']
          args: ['upgrade', 'head']
          env:
            - name: CMC_ENVIRONMENT
              value: prod
            - name: CMC_LOG_FORMAT
              value: json
            - name: CMC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Generated by CloudNativePG. Never committed — the operator
                  # creates it, and settings normalise its postgresql:// form to
                  # the async driver.
                  name: cmc-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
