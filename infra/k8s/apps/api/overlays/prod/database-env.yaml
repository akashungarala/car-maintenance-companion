# Point the API at the database CloudNativePG generated credentials for.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: CMC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cmc-db-app
                  key: uri
            - name: CMC_REDIS_URL
              value: redis://redis.cmc.svc.cluster.local:6379/0
            # The local collector, never a vendor URL (ADR-0004).
            - name: CMC_OTLP_ENDPOINT
              value: http://otel-collector.cmc.svc.cluster.local:4318
            # Where sign-in links point. The API cannot infer this: it is
            # reached through Cloudflare, Traefik and a path prefix, so a link
            # built from the incoming request would point somewhere the browser
            # cannot reach.
            - name: CMC_APP_BASE_URL
              value: https://www.akashungarala.com/apps/car-maintenance-companion
