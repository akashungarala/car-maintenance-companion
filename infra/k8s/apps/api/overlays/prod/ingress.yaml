apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    # Traefik ships with k3s and is the ingress (see the plan). Only the
    # websecure entrypoint: HTTP is redirected at Cloudflare's edge.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # namespace-name@kubernetescrd is Traefik's provider syntax; a bare name
    # silently matches nothing and the headers just never appear.
    traefik.ingress.kubernetes.io/router.middlewares: cmc-security-headers@kubernetescrd
spec:
  # Traefik served a self-signed certificate before this, which Cloudflare
  # accepted because the zone is on Full rather than Full (strict). Encrypted,
  # but unverified: Cloudflare could not distinguish this origin from anything
  # else answering on the address.
  tls:
    - hosts:
        - garage-api.akashungarala.com
      secretName: garage-api-tls
  rules:
    - host: garage-api.akashungarala.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
