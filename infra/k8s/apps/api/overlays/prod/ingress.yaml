apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    # Traefik ships with k3s and is the ingress (see the plan). Only the
    # websecure entrypoint: HTTP is redirected at Cloudflare's edge.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
    - host: garage-api.akashungarala.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
