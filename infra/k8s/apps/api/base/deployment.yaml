apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: car-maintenance-companion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # With 2 replicas on a 2-CPU node: never drop below full capacity, and
      # only schedule one extra pod at a time so a rollout cannot starve the
      # node it is rolling out on.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: car-maintenance-companion
    spec:
      # Single node today, but this makes the intent explicit and starts working
      # the moment a second node exists, rather than being remembered later.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/akashungarala/car-maintenance-companion/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CMC_ENVIRONMENT
              value: prod
            - name: CMC_LOG_FORMAT
              value: json
            # The proxy strips this prefix; FastAPI needs it to generate correct
            # /docs and openapi.json URLs. See ADR-0012.
            - name: CMC_ROOT_PATH
              value: /apps/car-maintenance-companion/api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              # No CPU limit on purpose: a limit here throttles rather than
              # protects, and the requests already govern scheduling. Memory
              # *is* limited, because unbounded memory takes the node down.
              memory: 256Mi

          # Three probes, three different questions.
          #
          # startup:   "has it finished booting?" — gates the other two, so a
          #            slow start is not mistaken for a failure.
          # liveness:  "is the process wedged?" — restarts the container.
          #            Points at /health, which touches nothing external, so a
          #            database blip cannot cause a restart storm.
          # readiness: "should traffic go here?" — removes the pod from the
          #            Service without restarting it. Points at /ready, which
          #            does check dependencies.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem is on, so anything needing scratch space needs
        # an explicit writable mount.
        - name: tmp
          emptyDir: {}
