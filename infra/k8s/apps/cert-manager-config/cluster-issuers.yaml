# DNS-01, not HTTP-01, and not by preference: restricting 80/443 to Cloudflare's
# ranges means Let's Encrypt cannot reach the origin to answer an HTTP
# challenge. Closing the origin and using HTTP-01 are mutually exclusive.
#
# DNS-01 is also the better fit regardless — it proves control of the domain
# rather than of one host, and it works for hosts that are not publicly
# reachable at all.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging first, always. Let's Encrypt allows five *failed* validations per
    # hour against production; a misconfigured solver burns that allowance in
    # minutes and then blocks the fix from being verified.
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # No email address is registered. Let's Encrypt uses it only for expiry
    # warnings, and cert-manager renews at two-thirds of the lifetime with our
    # own alerting as the backstop — so the notices would buy nothing in
    # exchange for handing a personal address to a third party.
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns-token
              key: api-token
