# Wave -1, alongside the other operators: ClusterIssuer and Certificate are
# custom resources this controller defines, so it must be running before
# anything referencing them syncs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: default
  source:
    repoURL: https://github.com/akashungarala/car-maintenance-companion.git
    targetRevision: main
    path: infra/k8s/platform/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRD-heavy bundle; client-side apply exceeds the last-applied
      # annotation size limit, same as CloudNativePG.
      - ServerSideApply=true
