apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    repoURL: https://github.com/akashungarala/car-maintenance-companion.git
    # Tracks `deploy`, not `main`.
    #
    # `main` is fully protected and never written by a machine — no bypass
    # actor, no deploy key, no token with elevated rights. CI instead merges
    # main into `deploy` and commits the image tag there, so `deploy` is a
    # literal record of what production is running, and rolling back is
    # `git revert` on that branch.
    #
    # It also means merging code to main does not deploy it by itself: the
    # deploy job does, after the images exist.
    targetRevision: deploy
    path: infra/k8s/apps/api/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: cmc
  syncPolicy:
    automated:
      # prune: removing a manifest from git removes it from the cluster, so git
      # is the whole truth rather than most of it.
      prune: true
      # selfHeal: a manual kubectl edit is reverted. Deliberate — the point of
      # ADR-0008 is that the cluster cannot drift from the repository.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
