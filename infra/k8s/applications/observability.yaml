# Wave 0, alongside the database and Redis: the collector should exist before
# the services that export to it. They tolerate its absence — tracing is a
# no-op without a reachable endpoint — but starting in the right order avoids a
# window of silently dropped spans on every fresh cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  source:
    repoURL: https://github.com/akashungarala/car-maintenance-companion.git
    targetRevision: main
    path: infra/k8s/apps/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: cmc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
