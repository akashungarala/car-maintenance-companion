# Sealed Secrets encrypts with a key only this cluster holds, so the encrypted
# form is safe to commit — which is what makes a public repo compatible with
# GitOps at all (ADR-0001, ADR-0008).
#
# Wave -1: it must exist before anything that ships a SealedSecret, or those
# resources sync into a cluster with nothing able to decrypt them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  project: default
  source:
    repoURL: https://github.com/akashungarala/car-maintenance-companion.git
    targetRevision: main
    path: infra/k8s/platform/sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The controller ships CRDs; without this the first sync races itself.
      - ServerSideApply=true
