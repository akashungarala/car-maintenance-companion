# Fast local gates. The authoritative gates live in .github/workflows/ci.yml —
# pre-commit exists to catch the cheap failures before they burn a CI run.
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # Secrets must never reach the remote. This is the single most important hook.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Local hook rather than mirrors-prettier: that mirror is archived, and this
  # guarantees the hook uses the exact prettier version pinned in package.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        exclude: ^(pnpm-lock\.yaml|packages/api-types/src/generated\.ts)$
