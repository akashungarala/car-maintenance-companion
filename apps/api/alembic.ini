# Alembic configuration. The database URL is deliberately absent: it comes from
# CMC_DATABASE_URL at runtime via migrations/env.py, so a connection string is
# never committed and never differs between this file and the application.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped, ordered filenames. Alphabetical order then matches chronological
# order, which matters the moment there is more than a handful.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
