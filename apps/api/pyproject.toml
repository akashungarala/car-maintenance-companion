[project]
name = "cmc-api"
version = "0.1.2"
description = "Car Maintenance Companion — API service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.4",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # asyncio-native and tiny, unlike Celery which is sync-first and brings far
    # more machinery than one worker needs (see the plan's component table).
    "arq>=0.26",
    # OTLP only — no vendor SDK. The Collector is the single place that knows a
    # backend exists (ADR-0004), so swapping Grafana Cloud for self-hosted
    # Loki/Tempo/Mimir is a Collector change with zero application edits.
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "pydantic[email]>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
