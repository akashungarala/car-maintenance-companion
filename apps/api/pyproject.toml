[project]
name = "cmc-api"
version = "0.1.0"
description = "Car Maintenance Companion — API service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "structlog>=24.4",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # asyncio-native and tiny, unlike Celery which is sync-first and brings far
    # more machinery than one worker needs (see the plan's component table).
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
