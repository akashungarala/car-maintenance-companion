name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; individual jobs opt into more.
permissions:
  contents: read

# A new push to a PR cancels the previous run — saves CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  # Detect which parts of the monorepo a PR actually touches, so a docs-only
  # change does not spend four minutes building and scanning a Docker image.
  # Formatting and secret scanning still run on everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            image:
              - 'apps/api/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Cheap and repo-wide: formatting covers docs, YAML and JSON too, so it must
  # not be gated on code paths.
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  backend:
    name: Backend (lint · types · tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no bare major tag past v7.6, so this pins a full
        # version; Dependabot keeps it current.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy apps/api/src

      - name: Tests + coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint · types · tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Version is read from package.json's `packageManager` field — single source of truth.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm --filter @cmc/web run build

      - name: Install Playwright browsers
        run: pnpm --filter @cmc/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @cmc/web exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: Security (secrets · dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # setup-uv publishes no bare major tag past v7.6, so this pins a full
        # version; Dependabot keeps it current.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Audit Python dependencies
        run: uvx pip-audit --strict --progress-spinner=off || exit 1

  image:
    name: Image (${{ matrix.service }})
    # Native arm64 to match the production cluster (ADR-0002); free and
    # unmetered on public repos, and ~5-10x faster than QEMU emulation.
    needs: changes
    if: needs.changes.outputs.image == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            port: 8000
            path: /health
            expect: '"status":"ok"'
          - service: web
            dockerfile: apps/web/Dockerfile
            port: 3000
            # basePath: the app deliberately serves nothing at the origin root.
            path: /apps/car-maintenance-companion
            expect: Hello World
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          tags: cmc-${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cmc-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test the container
        env:
          APP_PORT: ${{ matrix.port }}
          APP_PATH: ${{ matrix.path }}
          EXPECT: ${{ matrix.expect }}
        run: |
          docker run -d --name app -p "$APP_PORT:$APP_PORT" "cmc-${{ matrix.service }}:${{ github.sha }}"
          for i in $(seq 1 45); do
            if curl -fsS "http://localhost:$APP_PORT$APP_PATH" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "--- GET $APP_PATH ---"
          curl -fsS "http://localhost:$APP_PORT$APP_PATH" | tee /tmp/body | head -5
          grep -q "$EXPECT" /tmp/body
          echo "--- must run as non-root ---"
          test "$(docker exec app id -u)" = "10001"
          docker rm -f app

  infra:
    name: Infrastructure (fmt · validate)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - name: Check formatting
        run: tofu fmt -check -recursive -diff
        working-directory: infra/tofu

      # -backend=false: validation needs the provider schemas, not remote
      # state, so this runs without any cloud credentials.
      - name: Initialise providers
        run: tofu init -backend=false -input=false
        working-directory: infra/tofu

      - name: Validate
        run: tofu validate
        working-directory: infra/tofu

  # Publishes only from main. PRs build and scan images (the `image` job) but
  # never push, so a fork PR cannot put anything into the registry.
  publish:
    name: Publish (${{ matrix.service }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ci-passed]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          # The SHA tag is what deployments reference — immutable, so a given
          # deployment always means exactly one image. `main` is a convenience
          # pointer for humans and is never what the cluster runs.
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # Aggregate gate — this is the single required status check on main.
  # Adding a new job above means adding it to `needs` here, so nothing
  # can silently become non-blocking.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    needs: [changes, format, backend, frontend, security, image, infra]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          # A skipped job is a legitimate outcome: path filters skip work that
          # this PR cannot affect. Only failure and cancellation block a merge.
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
