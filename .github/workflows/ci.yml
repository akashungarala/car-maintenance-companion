name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; individual jobs opt into more.
permissions:
  contents: read

# A new push to a PR cancels the previous run — saves CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy apps/api/src

      - name: Tests + coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint · types · tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

  security:
    name: Security (secrets · dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Audit Python dependencies
        run: uvx pip-audit --strict --progress-spinner=off || exit 1

  # Aggregate gate — this is the single required status check on main.
  # Adding a new job above means adding it to `needs` here, so nothing
  # can silently become non-blocking.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    needs: [backend, frontend, security]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
