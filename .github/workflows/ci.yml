name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; individual jobs opt into more.
permissions:
  contents: read

# A new push to a PR cancels the previous run — saves CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no bare major tag past v7.6, so this pins a full
        # version; Dependabot keeps it current.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy apps/api/src

      - name: Tests + coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint · types · tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Version is read from package.json's `packageManager` field — single source of truth.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

  security:
    name: Security (secrets · dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        # setup-uv publishes no bare major tag past v7.6, so this pins a full
        # version; Dependabot keeps it current.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Audit Python dependencies
        run: uvx pip-audit --strict --progress-spinner=off || exit 1

  image:
    name: Image (build · scan · smoke)
    # Native arm64 to match the production cluster (ADR-0002); free and
    # unmetered on public repos, and ~5-10x faster than QEMU emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          tags: cmc-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cmc-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 cmc-api:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          echo "--- /health ---"
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          echo "--- /ready ---"
          curl -fsS http://localhost:8000/ready | grep -q '"status":"ready"'
          echo "--- must run as non-root ---"
          test "$(docker exec api id -u)" = "10001"
          docker rm -f api

  # Aggregate gate — this is the single required status check on main.
  # Adding a new job above means adding it to `needs` here, so nothing
  # can silently become non-blocking.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-24.04
    needs: [backend, frontend, security, image]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
