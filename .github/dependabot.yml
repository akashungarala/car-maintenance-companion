version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Docker is added back in F2/F3, once Dockerfiles exist. Declaring it against
  # non-existent paths makes Dependabot fail on every run.
